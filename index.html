<!-- Copying the code is easy, but when you create it, you have to become busy -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://leetcode.com/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        body {
            position: relative;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }

        .main-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }


        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)); }
        }

        .hero-subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .search-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 1s ease-out 0.3s both;
            max-width: 600px;
            width: 100%;
        }

        .search-title {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .leetcode-logo {
            height: 32px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .search-container {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .username-input {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .username-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 1);
            box-shadow: inset 0 0 0 2px #ffd700;
        }

        .username-input::placeholder {
            color: #666;
            font-weight: 400;
        }

        .search-button {
            padding: 16px 30px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #333;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-button:hover {
            background: linear-gradient(45deg, #ffed4e, #ffd700);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .badge-container {
            text-align: center;
            margin-top: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        .badge-container img {
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .badge-container img:hover {
            transform: scale(1.05);
        }

        .links-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }

        .link-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .link-card i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #ffd700;
        }

        .link-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .link-card p {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 300;
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .footer-text {
            font-size: 0.9rem;
            font-weight: 300;
            opacity: 0.8;
        }

        .target-cursor {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8) 0%, transparent 70%);
            border: 2px solid rgba(255, 215, 0, 0.6);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: all 0.1s ease;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #333;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .search-section {
                padding: 30px 20px;
                margin: 0 10px 30px;
            }
            
            .search-container {
                flex-direction: column;
                border-radius: 12px;
            }
            
            .username-input {
                border-radius: 12px 12px 0 0;
            }
            
            .search-button {
                border-radius: 0 0 12px 12px;
                justify-content: center;
            }
            
            .links-section {
                grid-template-columns: 1fr;
                margin: 0 10px 30px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 1.5rem;
            }
            
            .search-section {
                padding: 20px 15px;
            }
        }
    </style>
    <title>LEETCODE LIVE RANKING FINDER</title>
</head>
<body>
    <div class="particles"></div>
    <div class="target-cursor"></div>
    
    <div class="main-container">
        <div class="header-section">
            <h1 class="hero-title">LeetCode Live Ranking</h1>
        </div>

        <div class="search-section">
            <h2 class="search-title">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/LeetCode_Logo_black_with_text.svg/1280px-LeetCode_Logo_black_with_text.svg.png" alt="LeetCode" class="leetcode-logo">
                Ranking Finder
            </h2>
            <div class="search-container">
                <input type="text" class="username-input" id="username" placeholder="Enter LeetCode username only">
                <button class="search-button" onclick="search()" id="searchBtn">
                    <i class="fas fa-search"></i>
                    Search
                </button>
            </div>
            <div class="badge-container" id="badge-container"></div>
        </div>
		
		<br><br><br>

        <div class="links-section">
            <a href="https://github.com/yashu1wwww" class="link-card" target="_blank">
                <i class="fab fa-github"></i>
                <h3>GitHub Profile</h3>
                <p>Check out my repositories</p>
            </a>

            <a href="https://yashwanthwebproject.netlify.app" class="link-card" target="_blank">
                <i class="fas fa-code"></i>
                <h3>Web Projects</h3>
                <p>Explore my development work</p>
            </a>
        </div>

        <div class="footer">
            <p class="footer-text">© 2025 Developed with ❤️ by Yashwanth R</p>
        </div>
    </div>

   <script>
    const targetCursor = document.querySelector('.target-cursor');
    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    // Smooth cursor movement
    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function animateCursor() {
        cursorX += (mouseX - cursorX) * 0.1;
        cursorY += (mouseY - cursorY) * 0.1;
        targetCursor.style.left = cursorX + 'px';
        targetCursor.style.top = cursorY + 'px';
        requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Background particles
    function createParticles() {
        const particlesContainer = document.querySelector('.particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 6 + 's';
            particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
            particlesContainer.appendChild(particle);
        }
    }
    createParticles();

    // Enter key triggers search
    document.getElementById('username').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            search();
        }
    });

    // Live validation border color
    document.getElementById('username').addEventListener('input', function (e) {
        const input = e.target;
        const value = input.value.trim();
        const extracted = extractUsername(value);

        if (value && extracted && !isValidUsername(extracted)) {
            input.style.borderColor = '#ff6b6b';
        } else {
            input.style.borderColor = '';
        }
    });

    // ✅ Fixed username extraction (rejects leetcard URLs)
    function extractUsername(input) {
        if (!input) return '';

        input = input.trim().replace(/\/+$/, '');

        // ❌ Disallow direct leetcard URLs
        if (/leetcard\.jacoblin\.cool/i.test(input)) {
            return '';
        }

        // ✅ Extract from leetcode.com URLs
        const urlPatterns = [
            /leetcode\.com\/u\/([a-zA-Z0-9_-]+)/,
            /leetcode\.com\/([a-zA-Z0-9_-]+)\/?$/
        ];

        for (const pattern of urlPatterns) {
            const match = input.match(pattern);
            if (match && match[1]) {
                return match[1];
            }
        }

        // Otherwise treat as plain username
        return input;
    }

    function isValidUsername(username) {
        return /^[a-zA-Z0-9_-]+$/.test(username);
    }

    // Main search function
    function search() {
        const input = document.getElementById('username');
        const searchBtn = document.getElementById('searchBtn');
        const badgeContainer = document.getElementById('badge-container');
        const rawInput = input.value.trim();

        badgeContainer.innerHTML = '';

        if (!rawInput) {
            showNotification('Please enter a LeetCode username only', 'error');
            input.focus();
            return;
        }

        const username = extractUsername(rawInput);

        if (!username || !isValidUsername(username)) {
            showNotification('Please enter a valid username only', 'error');
            input.focus();
            return;
        }

        searchBtn.innerHTML = '<div class="loading"></div> Searching...';
        searchBtn.disabled = true;

        setTimeout(() => {
            displayBadge(username);
            searchBtn.innerHTML = '<i class="fas fa-search"></i> Search';
            searchBtn.disabled = false;
            document.getElementById('badge-container').scrollIntoView({ behavior: 'smooth' });
        }, 1000);
    }

    // ✅ Dynamic LeetCode card display (based on username)
    function displayBadge(username) {
        const badgeContainer = document.getElementById('badge-container');
        const badgeWrapper = document.createElement('div');
        badgeWrapper.style.cssText = `
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-out;
        `;

        const title = document.createElement('h3');
        title.textContent = `LeetCode Profile: ${username}`;
        title.style.cssText = `
            margin-bottom: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffd700;
        `;

        // 🟠 LeetCode Ranking Badge (from Shields.io)
        const badge = document.createElement('img');
        badge.src = `https://img.shields.io/badge/dynamic/json?style=for-the-badge&labelColor=black&color=%23ffa116&label=Ranking&query=ranking&url=https%3A%2F%2Fleetcode-badge.vercel.app%2Fapi%2Fusers%2F${username}&logo=leetcode&logoColor=yellow`;
        badge.alt = 'LeetCode Ranking';
        badge.style.cssText = `
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            max-width: 100%;
            height: auto;
        `;

     // 🟣 Full LeetCard (with unicorn theme) for that username
const leetCard = document.createElement('img');
leetCard.src = `https://leetcard.jacoblin.cool/${username}?theme=unicorn`;
leetCard.alt = `${username}'s LeetCode Card`;
leetCard.style.cssText = `
    margin-top: 20px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
`;


        badge.onerror = () => {
            showNotification('User not found or API error. Please check the username.', 'error');
            badgeContainer.innerHTML = '';
        };

        badgeWrapper.appendChild(title);
        badgeWrapper.appendChild(badge);
        badgeWrapper.appendChild(leetCard);
        badgeContainer.appendChild(badgeWrapper);
    }

    // Notification popup
    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.textContent = message;
        notification.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 10000;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            ${type === 'success'
                ? 'background: linear-gradient(45deg, #4CAF50, #45a049);'
                : 'background: linear-gradient(45deg, #f44336, #da190b);'}
        `;

        document.body.appendChild(notification);

        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease-out forwards';
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }

    // Add keyframe styles
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    `;
    document.head.appendChild(style);

    // Smooth scrolling
    document.documentElement.style.scrollBehavior = 'smooth';

    // Hover effects
    document.querySelectorAll('.link-card, .search-button').forEach(element => {
        element.addEventListener('mouseenter', function () {
            this.style.transform = this.classList.contains('link-card')
                ? 'translateY(-8px) scale(1.02)'
                : 'translateY(-2px) scale(1.02)';
        });

        element.addEventListener('mouseleave', function () {
            this.style.transform = this.classList.contains('link-card')
                ? 'translateY(0) scale(1)'
                : 'translateY(0) scale(1)';
        });
    });
</script>
</body>
</html>
