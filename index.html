<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeetTrack — Student Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e2e4ed;
    --accent: #e67e00;
    --accent2: #16a34a;
    --accent3: #dc2626;
    --accent4: #2563eb;
    --text: #1a1a2e;
    --muted: #8890a8;
    --easy: #16a34a;
    --medium: #d97706;
    --hard: #dc2626;
    --rank: #7c3aed;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 48px 0 32px;
    text-align: center;
  }

  .logo-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 4px;
    text-transform: uppercase;
    border: 1px solid var(--accent);
    padding: 4px 12px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  h1 {
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
    opacity: 0;
    animation: fadeUp 0.5s 0.1s ease forwards;
  }

  h1 span { color: var(--accent); }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 12px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    opacity: 0;
    animation: fadeUp 0.5s 0.2s ease forwards;
  }

  /* Input section */
  .input-section {
    margin: 40px 0 36px;
    opacity: 0;
    animation: fadeUp 0.5s 0.3s ease forwards;
  }

  .input-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: block;
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    padding: 16px 18px;
    border-radius: 4px;
    resize: vertical;
    min-height: 120px;
    transition: border-color 0.2s;
    line-height: 1.7;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  textarea::placeholder { color: var(--muted); }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 12px 28px;
    border: none;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.18s ease;
    text-transform: uppercase;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }

  .btn-primary:hover {
    background: #ea6a00;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(249,115,22,0.25);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-clear {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-clear:hover { border-color: var(--muted); color: var(--text); }

  .hint {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  /* Progress bar */
  .progress-wrap {
    display: none;
    margin: 20px 0;
  }

  .progress-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Stats summary bar */
  .stats-bar {
    display: none;
    gap: 1px;
    margin-bottom: 28px;
  }

  .stat-pill {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 16px;
    text-align: center;
  }

  .stat-pill:first-child { border-radius: 4px 0 0 4px; }
  .stat-pill:last-child { border-radius: 0 4px 4px 0; }

  .stat-pill .num {
    display: block;
    font-size: 1.6rem;
    font-weight: 800;
    line-height: 1;
  }

  .stat-pill .lbl {
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Table */
  .table-wrap {
    display: none;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 60px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  thead tr {
    background: #f0f1f8;
    border-bottom: 1px solid var(--border);
  }

  th {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 18px;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }

  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  th.sorted::after { content: ' ↑'; }
  th.sorted.desc::after { content: ' ↓'; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s;
    animation: rowIn 0.3s ease forwards;
    opacity: 0;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(249,115,22,0.05); }

  td {
    padding: 14px 18px;
    vertical-align: middle;
  }

  .rank-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 40px;
  }

  .username-cell {
    font-weight: 700;
    font-size: 14px;
  }

  .username-cell a {
    color: var(--text);
    text-decoration: none;
    transition: color 0.15s;
  }

  .username-cell a:hover { color: var(--accent); }

  .global-rank {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--rank);
    font-weight: 700;
  }

  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 3px;
  }

  .easy-badge { color: var(--easy); background: rgba(22,163,74,0.1); }
  .medium-badge { color: var(--medium); background: rgba(217,119,6,0.1); }
  .hard-badge { color: var(--hard); background: rgba(220,38,38,0.1); }
  .total-badge { color: var(--accent4); background: rgba(37,99,235,0.08); font-size: 13px; }

  .bar-wrap {
    display: flex;
    gap: 2px;
    width: 90px;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--border);
  }

  .bar-easy { background: var(--easy); }
  .bar-medium { background: var(--medium); }
  .bar-hard { background: var(--hard); }

  .status-error {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--hard);
    opacity: 0.8;
  }

  /* Empty / loading states */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  .empty-state .icon {
    font-size: 3rem;
    display: block;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(240,192,64,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  /* Sort controls */
  .controls {
    display: none;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .result-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .result-count span { color: var(--accent); }

  .export-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    letter-spacing: 1px;
  }

  .export-btn:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-tag">⚡ LeetTrack</div>
    <h1>Student <span>LeetCode</span><br>Dashboard</h1>
    <p class="subtitle">// paste profile links → fetch ranks & scores instantly</p>
  </header>

  <div class="input-section">
    <label class="input-label">Paste LeetCode Profile URLs</label>
    <textarea id="linksInput" placeholder="https://leetcode.com/u/username1/&#10;https://leetcode.com/u/username2/&#10;https://leetcode.com/u/username3/&#10;&#10;One per line, or comma/space separated — any format works"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="fetchAll()">
        <span id="btnText">Fetch Rankings</span>
      </button>
      <button class="btn btn-clear" onclick="clearAll()">Clear</button>
      <span class="hint" id="countHint"></span>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressText">Fetching...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="controls" id="controls">
    <div class="result-count" id="resultCount"></div>
    <button class="export-btn" onclick="exportCSV()">↓ Export CSV</button>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-pill"><span class="num" id="statTotal" style="color:var(--accent4)">—</span><span class="lbl">Students</span></div>
    <div class="stat-pill"><span class="num" id="statAvgRank" style="color:var(--rank)">—</span><span class="lbl">Avg Rank</span></div>
    <div class="stat-pill"><span class="num" id="statEasy" style="color:var(--easy)">—</span><span class="lbl">Avg Easy</span></div>
    <div class="stat-pill"><span class="num" id="statMedium" style="color:var(--medium)">—</span><span class="lbl">Avg Medium</span></div>
    <div class="stat-pill"><span class="num" id="statHard" style="color:var(--hard)">—</span><span class="lbl">Avg Hard</span></div>
    <div class="stat-pill"><span class="num" id="statSolved" style="color:var(--accent4)">—</span><span class="lbl">Avg Solved</span></div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table id="rankTable">
      <thead>
        <tr>
          <th>#</th>
          <th onclick="sortBy('username')" id="th-username">Username</th>
          <th onclick="sortBy('rank')" id="th-rank" class="sorted">Global Rank</th>
          <th onclick="sortBy('total')" id="th-total">Total</th>
          <th onclick="sortBy('easy')" id="th-easy">Easy</th>
          <th onclick="sortBy('medium')" id="th-medium">Medium</th>
          <th onclick="sortBy('hard')" id="th-hard">Hard</th>
          <th>Progress</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
let allData = [];
let sortKey = 'rank';
let sortDesc = false;

const PROXY = 'https://corsproxy.io/?';
const GQL = 'https://leetcode.com/graphql';

const QUERY = `query getUserProfile($username: String!) {
  matchedUser(username: $username) {
    username
    profile { ranking }
    submitStats {
      acSubmissionNum { difficulty count }
    }
  }
}`;

function extractUsernames(raw) {
  const urls = raw.match(/leetcode\.com\/(?:u\/)?([a-zA-Z0-9_\-\.]+)\/?/g) || [];
  const names = urls.map(u => {
    const m = u.match(/leetcode\.com\/(?:u\/)?([a-zA-Z0-9_\-\.]+)/);
    return m ? m[1] : null;
  }).filter(Boolean);
  // dedupe
  return [...new Set(names)].filter(n => n !== 'profile' && n !== 'problems' && n !== 'contest');
}

async function fetchUser(username) {
  const url = PROXY + encodeURIComponent(GQL);
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-requested-with': 'XMLHttpRequest' },
    body: JSON.stringify({ query: QUERY, variables: { username } })
  });
  const json = await res.json();
  const user = json?.data?.matchedUser;
  if (!user) return null;
  const stats = {};
  for (const s of user.submitStats.acSubmissionNum) stats[s.difficulty] = s.count;
  return {
    username: user.username,
    rank: user.profile.ranking || 9999999,
    easy: stats['Easy'] || 0,
    medium: stats['Medium'] || 0,
    hard: stats['Hard'] || 0,
    total: stats['All'] || 0
  };
}

async function fetchAll() {
  const raw = document.getElementById('linksInput').value.trim();
  if (!raw) return;
  const usernames = extractUsernames(raw);
  if (!usernames.length) {
    alert('No valid LeetCode profile URLs found. Make sure URLs contain /u/username or /username.');
    return;
  }

  allData = [];
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('tableBody').innerHTML = '';

  document.getElementById('progressWrap').style.display = 'block';
  const btn = document.getElementById('btnText');
  btn.innerHTML = '<span class="spinner"></span>Fetching...';

  for (let i = 0; i < usernames.length; i++) {
    const uname = usernames[i];
    const pct = Math.round(((i + 1) / usernames.length) * 100);
    document.getElementById('progressText').textContent = `Fetching ${uname}...`;
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';

    try {
      const data = await fetchUser(uname);
      if (data) allData.push({ ...data, error: false });
      else allData.push({ username: uname, rank: null, easy: 0, medium: 0, hard: 0, total: 0, error: true });
    } catch {
      allData.push({ username: uname, rank: null, easy: 0, medium: 0, hard: 0, total: 0, error: true });
    }
    await sleep(200);
  }

  document.getElementById('progressWrap').style.display = 'none';
  btn.textContent = 'Fetch Rankings';
  renderTable();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function sortBy(key) {
  if (sortKey === key) sortDesc = !sortDesc;
  else { sortKey = key; sortDesc = false; }
  document.querySelectorAll('th[id^="th-"]').forEach(th => {
    th.classList.remove('sorted', 'desc');
  });
  const th = document.getElementById('th-' + key);
  if (th) { th.classList.add('sorted'); if (sortDesc) th.classList.add('desc'); }
  renderTable();
}

function renderTable() {
  const sorted = [...allData].sort((a, b) => {
    let av = a[sortKey] ?? (sortKey === 'rank' ? 99999999 : 0);
    let bv = b[sortKey] ?? (sortKey === 'rank' ? 99999999 : 0);
    if (sortKey === 'username') { av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if (sortDesc) return av < bv ? 1 : -1;
    return av > bv ? 1 : -1;
  });

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  const maxTotal = Math.max(...allData.map(d => d.total || 0), 1);

  sorted.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.style.animationDelay = `${i * 30}ms`;
    const eW = Math.round((d.easy / maxTotal) * 100);
    const mW = Math.round((d.medium / maxTotal) * 100);
    const hW = Math.round((d.hard / maxTotal) * 100);

    tr.innerHTML = d.error
      ? `<td class="rank-num">${i + 1}</td>
         <td class="username-cell"><a href="https://leetcode.com/u/${d.username}/" target="_blank">${d.username}</a></td>
         <td colspan="6"><span class="status-error">✗ profile not found</span></td>`
      : `<td class="rank-num">${i + 1}</td>
         <td class="username-cell"><a href="https://leetcode.com/u/${d.username}/" target="_blank">${d.username}</a></td>
         <td><span class="global-rank">#${(d.rank || 'N/A').toLocaleString()}</span></td>
         <td><span class="score-badge total-badge">${d.total}</span></td>
         <td><span class="score-badge easy-badge">${d.easy}</span></td>
         <td><span class="score-badge medium-badge">${d.medium}</span></td>
         <td><span class="score-badge hard-badge">${d.hard}</span></td>
         <td>
           <div class="bar-wrap">
             <div class="bar-easy" style="width:${eW}%"></div>
             <div class="bar-medium" style="width:${mW}%"></div>
             <div class="bar-hard" style="width:${hW}%"></div>
           </div>
         </td>`;
    tbody.appendChild(tr);
  });

  const valid = allData.filter(d => !d.error);
  const avgRank = valid.length ? Math.round(valid.reduce((s, d) => s + (d.rank || 0), 0) / valid.length) : 0;
  const avgE = valid.length ? Math.round(valid.reduce((s, d) => s + d.easy, 0) / valid.length) : 0;
  const avgM = valid.length ? Math.round(valid.reduce((s, d) => s + d.medium, 0) / valid.length) : 0;
  const avgH = valid.length ? Math.round(valid.reduce((s, d) => s + d.hard, 0) / valid.length) : 0;
  const avgT = valid.length ? Math.round(valid.reduce((s, d) => s + d.total, 0) / valid.length) : 0;

  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statAvgRank').textContent = '#' + avgRank.toLocaleString();
  document.getElementById('statEasy').textContent = avgE;
  document.getElementById('statMedium').textContent = avgM;
  document.getElementById('statHard').textContent = avgH;
  document.getElementById('statSolved').textContent = avgT;

  const errors = allData.filter(d => d.error).length;
  document.getElementById('resultCount').innerHTML =
    `<span>${allData.length}</span> profiles loaded${errors ? ` · <span style="color:var(--hard)">${errors} not found</span>` : ''}`;

  document.getElementById('tableWrap').style.display = 'block';
  document.getElementById('statsBar').style.display = 'flex';
  document.getElementById('controls').style.display = 'flex';
}

function clearAll() {
  document.getElementById('linksInput').value = '';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('countHint').textContent = '';
  allData = [];
}

function exportCSV() {
  const rows = [['#', 'Username', 'Global Rank', 'Total', 'Easy', 'Medium', 'Hard', 'Profile URL']];
  [...allData].sort((a, b) => (a.rank || 9e9) - (b.rank || 9e9)).forEach((d, i) => {
    rows.push([i + 1, d.username, d.rank || 'N/A', d.total, d.easy, d.medium, d.hard, `https://leetcode.com/u/${d.username}/`]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'leetcode_rankings.csv';
  a.click();
}

// Live URL count
document.getElementById('linksInput').addEventListener('input', function () {
  const names = extractUsernames(this.value);
  document.getElementById('countHint').textContent = names.length ? `${names.length} profile${names.length > 1 ? 's' : ''} detected` : '';
});

// Ctrl+Enter shortcut
document.getElementById('linksInput').addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.key === 'Enter') fetchAll();
});
</script>
</body>
</html>
